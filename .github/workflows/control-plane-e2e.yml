name: Control Plane E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "scripts/e2e_v2.sh"
      - "docker-compose.yml"
      - "docker-compose.e2e.yml"
      - "Makefile"
      - ".github/workflows/control-plane-e2e.yml"

jobs:
  task-26-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run full control-plane E2E suite
        run: make e2e-v2

      - name: Capture Compose state
        if: failure()
        run: |
          docker compose \
            --project-name ragforge-e2e \
            --file docker-compose.yml \
            --file docker-compose.e2e.yml \
            --profile airflow \
            ps --all
