services:
  # =========================
  # Core Services
  # =========================

  postgres:
    image: postgres:16
    container_name: ragforge_postgres
    environment:
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
      POSTGRES_DB: ragforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=50"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ragforge_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g

  minio:
    image: minio/minio:latest
    container_name: ragforge_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragforge
      MINIO_ROOT_PASSWORD: ragforge123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    container_name: ragforge_minio_init
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init/init_minio.sh"]
    environment:
      MINIO_ROOT_USER: ragforge
      MINIO_ROOT_PASSWORD: ragforge123
    volumes:
      - ./scripts/init_minio.sh:/init/init_minio.sh:ro
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: ragforge_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # FastAPI App
  # =========================

  fastapi:
    image: python:3.12-slim
    container_name: ragforge_fastapi
    working_dir: /home/snow/Documents/Projects/RAGForge/backend
    command:
      - /home/snow/Documents/Projects/RAGForge/backend/.venv/bin/uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      DEBUG_RETURN_CONTEXT: ${DEBUG_RETURN_CONTEXT:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_MULTIMODAL_PAGES: ${MAX_MULTIMODAL_PAGES:-50}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/home/snow/Documents/Projects/RAGForge/backend
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g

  # =========================
  # Airflow Metadata Database
  # =========================

  airflow-postgres:
    image: postgres:16
    container_name: ragforge_airflow_postgres
    profiles: ["batch"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=30"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Airflow Common Config
  # =========================

  airflow-init:
    image: apache/airflow:2.10.3
    container_name: ragforge_airflow_init
    profiles: ["batch"]
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW_UID: "50000"

      RAGFORGE_DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ragforge
      MINIO_SECRET_KEY: ragforge123
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /opt/ragforge/backend
    user: "0:0"
    command: >
      bash -lc "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true
      "
    volumes:
      - ./backend:/opt/ragforge/backend
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/logs:/opt/airflow/logs
      - ./backend/airflow/plugins:/opt/airflow/plugins
    mem_limit: 1g

  airflow-webserver:
    image: apache/airflow:2.10.3
    container_name: ragforge_airflow_webserver
    profiles: ["batch"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__WEBSERVER__SECRET_KEY: change-me
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW_UID: "50000"

      RAGFORGE_DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ragforge
      MINIO_SECRET_KEY: ragforge123
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /opt/ragforge/backend
    command: webserver
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/opt/ragforge/backend
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/logs:/opt/airflow/logs
      - ./backend/airflow/plugins:/opt/airflow/plugins
    mem_limit: 1.5g

  airflow-scheduler:
    image: apache/airflow:2.10.3
    container_name: ragforge_airflow_scheduler
    profiles: ["batch"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW_UID: "50000"

      RAGFORGE_DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ragforge
      MINIO_SECRET_KEY: ragforge123
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /opt/ragforge/backend
    command: scheduler
    volumes:
      - ./backend:/opt/ragforge/backend
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/logs:/opt/airflow/logs
      - ./backend/airflow/plugins:/opt/airflow/plugins
    mem_limit: 1.5g

  # =========================
  # Spark Local Mode
  # =========================

  spark:
    image: bitnami/spark:3.5
    container_name: ragforge_spark
    profiles: ["batch"]
    command: tail -f /dev/null
    environment:
      SPARK_MODE: master
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      PYTHONPATH: /opt/ragforge/backend
    volumes:
      - ./backend:/opt/ragforge/backend
      - ./backend/jobs:/opt/ragforge/jobs
      - spark_data:/tmp/spark
    mem_limit: 3g

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  airflow_postgres_data:
  spark_data:
