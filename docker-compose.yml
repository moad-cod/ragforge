x-airflow-common: &airflow-common
  image: ${RAGFORGE_AIRFLOW_IMAGE_NAME:-ragforge-airflow:3.3.0}
  build:
    context: ./backend
    dockerfile: airflow/Dockerfile
    args:
      AIRFLOW_BASE_IMAGE: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.3.0}
  profiles: ["airflow"]
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "2"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_JWT_SECRET:-ragforge-airflow-dev-jwt-secret}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}

    RAGFORGE_DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
    DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
    SECRET_KEY: ${SECRET_KEY:-ragforge-airflow-local-only}
    QDRANT_URL: http://qdrant:6333
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
    GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
    LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
    LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
    EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
    EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
    EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-192}
    EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-900}
    EMBEDDING_ALLOW_MODEL_DOWNLOAD: ${EMBEDDING_ALLOW_MODEL_DOWNLOAD:-true}
    EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/models/fastembed}
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ragforge
    MINIO_SECRET_KEY: ragforge123
    MINIO_BUCKET_BRONZE: bronze
    MINIO_BUCKET_SILVER: silver
    MINIO_BUCKET_GOLD: gold
    REDIS_URL: redis://redis:6379/0
    RAGFORGE_API_URL: http://fastapi:8000
    PIPELINE_SERVICE_TOKEN: ${PIPELINE_SERVICE_TOKEN:-}
    RAGFORGE_BRONZE_TO_SILVER_CMD: ${RAGFORGE_BRONZE_TO_SILVER_CMD:-python -m jobs.bronze_to_silver --ingestion-run-id {ingestion_run_id}}
    RAGFORGE_SILVER_TO_GOLD_CMD: ${RAGFORGE_SILVER_TO_GOLD_CMD:-python -m jobs.silver_to_gold --ingestion-run-id {ingestion_run_id}}
    RAGFORGE_UPSERT_QDRANT_CMD: ${RAGFORGE_UPSERT_QDRANT_CMD:-python -m jobs.upsert_qdrant --ingestion-run-id {ingestion_run_id}}
    PYTHONPATH: /opt/ragforge/backend
  volumes:
    - ./backend:/opt/ragforge/backend
    - ./backend/airflow/dags:/opt/airflow/dags
    - ./backend/airflow/logs:/opt/airflow/logs
    - ./backend/airflow/plugins:/opt/airflow/plugins
    - embedding_model_cache:/models

services:
  # =========================
  # Core Services
  # =========================

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ragforge
      POSTGRES_PASSWORD: ragforge
      POSTGRES_DB: ragforge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=50"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragforge -d ragforge"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    mem_limit: 2g

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ragforge
      MINIO_ROOT_PASSWORD: ragforge123
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/init/init_minio.sh"]
    environment:
      MINIO_ROOT_USER: ragforge
      MINIO_ROOT_PASSWORD: ragforge123
    volumes:
      - ./scripts/init_minio.sh:/init/init_minio.sh:ro
    restart: "no"

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # FastAPI App
  # =========================

  fastapi:
    build:
      context: ./backend
    working_dir: /app
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-auto}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-192}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-900}
      EMBEDDING_ALLOW_MODEL_DOWNLOAD: ${EMBEDDING_ALLOW_MODEL_DOWNLOAD:-true}
      EMBEDDING_CACHE_DIR: ${EMBEDDING_CACHE_DIR:-/models/fastembed}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ragforge
      MINIO_SECRET_KEY: ragforge123
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      REDIS_URL: redis://redis:6379/0
      QUERY_CACHE_TTL_SECONDS: ${QUERY_CACHE_TTL_SECONDS:-300}
      EVENT_STREAM_MAXLEN: ${EVENT_STREAM_MAXLEN:-512}
      EVENT_STREAM_TTL_SECONDS: ${EVENT_STREAM_TTL_SECONDS:-3600}
      SSE_HEARTBEAT_SECONDS: ${SSE_HEARTBEAT_SECONDS:-15}
      SSE_POLL_SECONDS: ${SSE_POLL_SECONDS:-1}
      ORCHESTRATOR: ${ORCHESTRATOR:-airflow}
      AIRFLOW_API_URL: ${AIRFLOW_API_URL:-}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-admin}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
      AIRFLOW_INGESTION_DAG_ID: ${AIRFLOW_INGESTION_DAG_ID:-ragforge_ingestion}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_TASK_RETRY_DELAY_SECONDS: ${CELERY_TASK_RETRY_DELAY_SECONDS:-10}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-2}
      PIPELINE_SERVICE_TOKEN: ${PIPELINE_SERVICE_TOKEN:-}
      DEBUG_RETURN_CONTEXT: ${DEBUG_RETURN_CONTEXT:-false}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MAX_MULTIMODAL_PAGES: ${MAX_MULTIMODAL_PAGES:-50}
    ports:
      - "${FASTAPI_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - embedding_model_cache:/models
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g

  # =========================
  # Celery Ingestion Worker
  # =========================

  celery-worker:
    build:
      context: ./backend
    profiles: ["celery"]
    working_dir: /app
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+asyncpg://ragforge:ragforge@postgres:5432/ragforge
      SECRET_KEY: ${SECRET_KEY:-ragforge-celery-local-only}
      QDRANT_URL: http://qdrant:6333
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-fastembed}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ragforge
      MINIO_SECRET_KEY: ragforge123
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      CELERY_WORKER_PREFETCH_MULTIPLIER: ${CELERY_WORKER_PREFETCH_MULTIPLIER:-1}
      CELERY_TASK_RETRY_DELAY_SECONDS: ${CELERY_TASK_RETRY_DELAY_SECONDS:-10}
      CELERY_TASK_MAX_RETRIES: ${CELERY_TASK_MAX_RETRIES:-2}
      RAGFORGE_API_URL: http://fastapi:8000
      PIPELINE_SERVICE_TOKEN: ${PIPELINE_SERVICE_TOKEN:-}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app
    depends_on:
      fastapi:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 1g

  # =========================
  # Next.js Control Plane UI
  # =========================

  frontend:
    build:
      context: ./frontend
    environment:
      BACKEND_URL: http://fastapi:8000
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      fastapi:
        condition: service_started
    restart: unless-stopped
    mem_limit: 768m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # =========================
  # Airflow Metadata Database
  # =========================

  airflow-postgres:
    image: postgres:16
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "max_connections=30"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================
  # Airflow 3.3 Local Stack
  # =========================

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_PASSWORD:-admin}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/dags /opt/airflow/plugins
        exec /entrypoint airflow version
    mem_limit: 1g

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1.5g

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1.5g

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 1g

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m

  # =========================
  # Spark Local Mode
  # =========================

  spark:
    image: spark:3.5.8-java17-python3
    profiles: ["airflow"]
    command: tail -f /dev/null
    environment:
      SPARK_MODE: master
      SPARK_DRIVER_MEMORY: 2g
      SPARK_EXECUTOR_MEMORY: 2g
      PYTHONPATH: /opt/ragforge/backend
    volumes:
      - ./backend:/opt/ragforge/backend
      - ./backend/jobs:/opt/ragforge/jobs
      - spark_data:/tmp/spark
    mem_limit: 3g

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
  redis_data:
  airflow_postgres_data:
  spark_data:
